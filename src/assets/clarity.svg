<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <rect width="32" height="32" rx="8" fill="#0F172A"/>
  
  <!-- Задняя карточка -->
  <rect x="6" y="6" width="15" height="17" rx="2" stroke="#909090" stroke-width="1.5"/>
  
  <!-- Передняя акцентная карточка -->
  <rect x="11" y="10" width="15" height="17" rx="2" fill="#131C2E" stroke="#2DD4BF" stroke-width="2"/>
  
  <!-- Строчки на передней карточке -->
  <line x1="15" y1="15" x2="22" y2="15" stroke="#2DD4BF" stroke-width="2" stroke-linecap="round"/>
  <line x1="15" y1="19" x2="20" y2="19" stroke="#E2E8F0" stroke-width="2" stroke-linecap="round"/>
</svg>
